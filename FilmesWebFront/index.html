<!DOCTYPE html>
<html lang="pt-BR" data-bs-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CINEFIPP · Catálogo de Filmes</title>
    <meta name="description" content="CINEFIPP - plataforma acadêmica de catálogo de filmes.">
    <link rel="icon" type="image/png" href="assets/favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/cinefipp.css">
    <!-- aplica o tema salvo antes da primeira pintura (evita "piscar" a tela) -->
    <script>
        (function () {
            try {
                var t = localStorage.getItem("cinefipp:tema");
                document.documentElement.setAttribute("data-bs-theme", t === "light" ? "light" : "dark");
            } catch (e) { /* modo privado */ }
        })();
    </script>
</head>

<body>
    <div class="page">
        <div data-header></div>

        <main>
            <!-- HERO: sugestão do dia (GET /apis/random-movie) -->
            <div id="heroSlot">
                <section class="hero hero--skeleton">
                    <div class="hero__bg hero__bg--empty"></div>
                    <div class="hero__scrim"></div>
                    <div class="container hero__inner">
                        <div class="hero__content">
                            <span class="eyebrow">Sugestão do dia</span>
                            <h1 class="hero__title">Carregando…</h1>
                        </div>
                    </div>
                </section>
            </div>

            <!-- ÚLTIMOS CADASTRADOS (GET /apis/list-movies) -->
            <section class="section container">
                <div class="d-flex flex-wrap align-items-end justify-content-between gap-3 mb-4">
                    <div>
                        <h2 class="section-title">Últimos cadastrados</h2>
                        <p class="section-sub">Os filmes mais recentes do catálogo CINEFIPP.</p>
                    </div>
                    <a class="link-more" href="pesquisa.html">Ver catálogo</a>
                </div>
                <div id="ultimosSlot"></div>
            </section>

            <!-- TRILHO: sugestões do dia -->
            <section class="section section--tight container">
                <div class="d-flex flex-wrap align-items-end justify-content-between gap-3 mb-4">
                    <div>
                        <h2 class="section-title section-title--red">Sugestões do dia</h2>
                        <p class="section-sub">Uma seleção rotativa do acervo, renovada a cada dia.</p>
                    </div>
                    <div class="d-flex gap-2" id="sugestoesNav">
                        <button class="cine-rail__btn" type="button" data-dir="prev" aria-label="Anterior"></button>
                        <button class="cine-rail__btn" type="button" data-dir="next" aria-label="Próximo"></button>
                    </div>
                </div>
                <div id="sugestoesSlot"></div>
            </section>

            <!-- TOP 10 DA SEMANA -->
            <section class="section container">
                <div class="d-flex flex-wrap align-items-end justify-content-between gap-3 mb-4">
                    <div>
                        <h2 class="section-title section-title--gold">Top 10 da semana</h2>
                        <p class="section-sub">Ranking montado a partir do acervo cadastrado na API.</p>
                    </div>
                    <div class="d-flex gap-2" id="rankingNav">
                        <button class="cine-rail__btn" type="button" data-dir="prev" aria-label="Anterior"></button>
                        <button class="cine-rail__btn" type="button" data-dir="next" aria-label="Próximo"></button>
                    </div>
                </div>
                <div id="rankingSlot"></div>
            </section>
        </main>

        <div data-footer></div>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/api.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/indexController.js"></script>
</body>

</html>
