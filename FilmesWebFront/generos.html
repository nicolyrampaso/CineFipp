<!DOCTYPE html>
<html lang="pt-BR" data-bs-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CINEFIPP · Gêneros</title>
    <link rel="icon" type="image/png" href="assets/favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/cinefipp.css">
    <script>
        (function () {
            try {
                var t = localStorage.getItem("cinefipp:tema");
                document.documentElement.setAttribute("data-bs-theme", t === "light" ? "light" : "dark");
            } catch (e) { /* modo privado */ }
        })();
    </script>
</head>

<body>
    <div class="page">
        <div data-header></div>

        <main>
            <section class="container page-head">
                <span class="eyebrow">Explorar</span>
                <h1>Gêneros</h1>
                <p>Escolha um gênero para ver todos os filmes do catálogo classificados nele.</p>
            </section>

            <section class="container section section--tight">
                <div id="generosSlot"></div>
            </section>
        </main>

        <div data-footer></div>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/api.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/generosController.js"></script>
</body>

</html>
