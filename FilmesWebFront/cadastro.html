<!DOCTYPE html>
<html lang="pt-BR" data-bs-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CINEFIPP · Cadastrar Filme</title>
    <link rel="icon" type="image/png" href="assets/favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/cinefipp.css">
    <script>
        (function () {
            try {
                var t = localStorage.getItem("cinefipp:tema");
                document.documentElement.setAttribute("data-bs-theme", t === "light" ? "light" : "dark");
            } catch (e) { /* modo privado */ }
        })();
    </script>
</head>

<body>
    <div class="page">
        <div data-header></div>

        <main>
            <section class="container page-head">
                <span class="eyebrow">Acervo</span>
                <h1>Cadastrar filme</h1>
                <p>Adicione um novo título ao catálogo CINEFIPP. O poster é opcional, mas deixa o card muito mais bonito.</p>
            </section>

            <section class="container section section--tight">
                <div class="surface-card">
                    <form id="formFilme" class="row g-4" novalidate>
                        <div class="col-lg-7">
                            <div class="mb-4">
                                <label for="campoTitulo" class="form-label">Título *</label>
                                <input class="form-control" type="text" id="campoTitulo" name="titulo"
                                    placeholder="Ex.: De Volta para o Futuro" autocomplete="off" maxlength="120">
                                <div class="invalid-feedback" id="erroTitulo"></div>
                            </div>

                            <div class="row g-3 mb-4">
                                <div class="col-sm-6">
                                    <label for="campoAno" class="form-label">Ano de lançamento *</label>
                                    <input class="form-control" type="number" id="campoAno" name="ano"
                                        placeholder="1985" min="1888" step="1" inputmode="numeric">
                                    <div class="invalid-feedback" id="erroAno"></div>
                                </div>
                                <div class="col-sm-6">
                                    <label for="campoGenero" class="form-label">Gênero *</label>
                                    <select class="form-select" id="campoGenero" name="genero"></select>
                                    <div class="invalid-feedback" id="erroGenero"></div>
                                </div>
                            </div>

                            <div id="mensagemSlot" class="mb-4"></div>

                            <div class="d-flex flex-wrap gap-3">
                                <button class="btn btn-cine-red" type="submit" id="btnSalvar">Cadastrar filme</button>
                                <button class="btn btn-cine-ghost" type="reset" id="btnLimpar">Limpar</button>
                            </div>
                        </div>

                        <!-- upload do poster (preview gerado no navegador) -->
                        <div class="col-lg-5">
                            <label for="campoPoster" class="form-label">Poster (opcional)</label>
                            <div id="uploadSlot">
                                <div class="dropzone" tabindex="0" role="button"
                                    aria-label="Selecionar arquivo do poster">
                                    <div class="dropzone__icon" id="dropzoneIcone"></div>
                                    <strong>Arraste seu poster aqui ou clique para selecionar</strong>
                                    <small>JPG, JPEG ou PNG · até 5 MB</small>
                                </div>
                            </div>
                            <!-- fica fora do #uploadSlot para sobreviver à troca dropzone/preview -->
                            <input class="d-none" type="file" id="campoPoster" name="poster" accept=".jpg,.jpeg,.png,image/jpeg,image/png">
                            <div class="invalid-feedback" id="erroPoster"></div>
                        </div>
                    </form>
                </div>
            </section>
        </main>

        <div data-footer></div>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/api.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/cadastroController.js"></script>
</body>

</html>
