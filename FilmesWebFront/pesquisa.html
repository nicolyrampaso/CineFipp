<!DOCTYPE html>
<html lang="pt-BR" data-bs-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CINEFIPP · Pesquisar Filmes</title>
    <link rel="icon" type="image/png" href="assets/favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/cinefipp.css">
    <script>
        (function () {
            try {
                var t = localStorage.getItem("cinefipp:tema");
                document.documentElement.setAttribute("data-bs-theme", t === "light" ? "light" : "dark");
            } catch (e) { /* modo privado */ }
        })();
    </script>
</head>

<body>
    <div class="page">
        <div data-header></div>

        <main>
            <section class="container page-head">
                <span class="eyebrow">Catálogo</span>
                <h1>Pesquisar filmes</h1>
                <p>Encontre filmes por palavra-chave, gênero ou faixa de datas.</p>
            </section>

            <section class="container section section--tight">
                <div class="surface-card">
                    <div class="filters__tabs nav nav-pills mb-4" role="tablist" aria-label="Tipo de pesquisa">
                        <button class="filters__tab nav-link active" type="button" role="tab" data-tab="palavra"
                            aria-selected="true">Palavra-chave</button>
                        <button class="filters__tab nav-link" type="button" role="tab" data-tab="genero"
                            aria-selected="false">Gênero</button>
                        <button class="filters__tab nav-link" type="button" role="tab" data-tab="ano"
                            aria-selected="false">Faixa de datas</button>
                    </div>

                    <!-- palavra-chave: GET /apis/list-keyword/{palavra} -->
                    <form class="filters__panel" data-panel="palavra" novalidate>
                        <div class="row g-3 align-items-end">
                            <div class="col-lg">
                                <label for="campoPalavra" class="form-label">Palavra-chave no título</label>
                                <div class="search-input-wrap" id="wrapPalavra">
                                    <input class="form-control" type="text" id="campoPalavra" name="palavra"
                                        placeholder="Ex.: poderoso, futuro, blade" autocomplete="off">
                                </div>
                                <div class="invalid-feedback" id="erroPalavra"></div>
                            </div>
                            <div class="col-lg-auto">
                                <button class="btn btn-cine-red w-100" type="submit">Pesquisar</button>
                            </div>
                        </div>
                    </form>

                    <!-- gênero: GET /apis/get-generos + GET /apis/list-genre/{genero} -->
                    <form class="filters__panel d-none" data-panel="genero" novalidate>
                        <div class="row g-3 align-items-end">
                            <div class="col-lg">
                                <label for="campoGenero" class="form-label">Gênero</label>
                                <select class="form-select" id="campoGenero" name="genero"></select>
                                <div class="invalid-feedback" id="erroGenero"></div>
                            </div>
                            <div class="col-lg-auto">
                                <button class="btn btn-cine-red w-100" type="submit">Pesquisar</button>
                            </div>
                        </div>
                    </form>

                    <!-- faixa de anos: GET /apis/list-year/{dt-inicio}/{dt-fim} -->
                    <form class="filters__panel d-none" data-panel="ano" novalidate>
                        <div class="row g-3 align-items-end">
                            <div class="col-sm">
                                <label for="campoAnoInicio" class="form-label">Ano inicial</label>
                                <input class="form-control" type="number" id="campoAnoInicio" name="anoInicio"
                                    placeholder="1970" min="1888" step="1" inputmode="numeric">
                            </div>
                            <div class="col-sm">
                                <label for="campoAnoFim" class="form-label">Ano final</label>
                                <input class="form-control" type="number" id="campoAnoFim" name="anoFim"
                                    placeholder="1990" min="1888" step="1" inputmode="numeric">
                            </div>
                            <div class="col-sm-auto">
                                <button class="btn btn-cine-red w-100" type="submit">Pesquisar</button>
                            </div>
                        </div>
                        <div class="invalid-feedback mt-2" id="erroAno"></div>
                    </form>
                </div>
            </section>

            <section class="container section">
                <div class="mb-4">
                    <h2 class="section-title">Resultados encontrados</h2>
                    <p class="section-sub" id="resumoResultados">Nenhuma pesquisa realizada ainda.</p>
                </div>
                <div id="resultadosSlot"></div>
            </section>
        </main>

        <div data-footer></div>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/api.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/pesquisaController.js"></script>
</body>

</html>
